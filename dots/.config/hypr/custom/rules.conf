# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# Disable blur for all xwayland apps
# windowrule = no_blur on, match:xwayland 1

# Bitwarden popup-style window (Brave extension app window)
windowrule = match:class ^(brave-nngceckbapebfimnlniiiahkandclblb(-.*)?)$, float on
windowrule = match:class ^(brave-nngceckbapebfimnlniiiahkandclblb(-.*)?)$, center on

# open notepad in float
windowrule = match:class ^(org.gnome.TextEditor)$, float on
windowrule = match:class ^(org.gnome.TextEditor)$, center on


# dolphin extract 
windowrule = match:title ^(Extract.*Dolphin)$, float on
windowrule = match:title ^(Extract.*Dolphin)$, center on

# arc extract
windowrule = match:class ^(org.kde.ark)$, float on
windowrule = match:class ^(org.kde.ark)$, center on

# qbit popup window
windowrule = match:class ^(org.qbittorrent.qBittorrent)$, match:title ^(?!org\.qbittorrent\.qBittorrent$).+, float on
windowrule = match:class ^(org.qbittorrent.qBittorrent)$, match:title ^(?!org\.qbittorrent\.qBittorrent$).+, center on

# fix blurry apps
xwayland {
  force_zero_scaling = true
}
